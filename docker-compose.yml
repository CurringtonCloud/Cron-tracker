services:
  cron-tracker:
    build: .
    container_name: cron-tracker
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - cron-data:/data
    environment:
      - PORT=3000
      - DATA_DIR=/data
      - API_KEY=${API_KEY}
    restart: unless-stopped

volumes:
  cron-data:
    driver: local
